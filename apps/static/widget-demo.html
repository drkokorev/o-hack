<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Помощник в путешествиях — пример виджета</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<style>
  * { box-sizing: border-box; }
  body { margin: 0; color: #142830; background: #f1f5f3; font: 16px/1.5 system-ui, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 20px clamp(20px, 5vw, 72px); border-bottom: 1px solid #d9e2e0; }
  .brand { font-weight: 800; font-size: 20px; letter-spacing: -.05em; } .brand span { color: #19645d; }
  a { color: #52656c; text-decoration: none; } a:hover { color: #19645d; }
  main { display: grid; grid-template-columns: 1.15fr .85fr; gap: 7vw; align-items: center; max-width: 1400px; margin: auto; padding: clamp(70px, 10vw, 150px) clamp(20px, 5vw, 72px); }
  .eyebrow { color: #19645d; font-weight: 700; font-size: 13px; text-transform: uppercase; letter-spacing: .12em; }
  h1 { font-size: clamp(42px, 6vw, 88px); line-height: 1.03; letter-spacing: -.055em; margin: 16px 0 24px; max-width: 11ch; }
  p { color: #52656c; max-width: 48ch; font-size: 18px; }
  .sample { background: #fff; border: 1px solid #d9e2e0; border-radius: 28px; min-height: 320px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 20px 60px #1428300a; }
  .sample .mark { font-size: 58px; color: #19645d; } .sample b { font-size: 25px; letter-spacing: -.03em; }
  .sample span { color: #657a80; }
  @media (max-width: 700px) { main { grid-template-columns: 1fr; padding-top: 60px; } .sample { min-height: 200px; } }
</style>
<script src="/static/embed.js" defer></script>
</head>
<body>
<header><div class="brand">О<span>!</span>дин запрос</div><a href="/">Полная версия</a></header>
<main>
  <div><div class="eyebrow">Место для новых впечатлений</div><h1>Поездка начинается с идеи</h1>
    <p>Расскажите помощнику, о чём мечтаете, — он поможет разобраться с направлением и деталями поездки.</p></div>
  <div class="sample"><div class="mark">✳</div><div><b>Куда хочется?</b><br><span>Море, горы, город или что-то совсем новое</span></div></div>
</main>
</body>
</html>
